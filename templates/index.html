<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grievance Management Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="navbar">
        <h2>🛡️ Grievance Portal</h2>
        <span class="engine-tag">C++ Engine Powered</span>
    </div>

    <div class="container">
        <!-- Submit Complaint Card -->
        <div class="card">
            <h3>📝 Submit a Grievance</h3>
            <p class="subtitle">Fill in the details below to log your issue</p>

            <form id="grievanceForm">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="title" placeholder="e.g. Hostel Wi-Fi Issue" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="category" required>
                        <option value="Hostel">Hostel</option>
                        <option value="Academics">Academics</option>
                        <option value="Infrastructure">Infrastructure</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="4" placeholder="Provide complete details..." required></textarea>
                </div>

                <button type="submit" class="btn">🚀 Submit Grievance</button>
            </form>
        </div>

        <!-- Complaints List Card -->
        <div class="card">
            <h3>📑 Recent Grievances</h3>
            <p class="subtitle">Live status of reported issues</p>
            <div id="complaintsList" class="complaints-container">
                <p>Loading grievances...</p>
            </div>
        </div>
    </div>

    <script>
        // Fetch and display complaints
        async function loadComplaints() {
            try {
                const res = await fetch('/get_complaints');
                const data = await res.json();
                const list = document.getElementById('complaintsList');
                list.innerHTML = '';

                if (data.length === 0) {
                    list.innerHTML = '<p class="empty-msg">No grievances submitted yet.</p>';
                    return;
                }

                data.reverse().forEach(item => {
                    const statusClass = (item.status || 'Pending').toLowerCase().replace(' ', '-');
                    const div = document.createElement('div');
                    div.className = 'complaint-item';
                    div.innerHTML = `
                        <div class="item-header">
                            <h4>${item.title}</h4>
                            <span class="badge category-badge">${item.category}</span>
                        </div>
                        <p class="desc">${item.description}</p>
                        <div class="item-footer">
                            <span class="badge status-badge ${statusClass}">● ${item.status || 'Pending'}</span>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } catch (err) {
                console.error("Error loading complaints:", err);
            }
        }

        // Form Submit
        document.getElementById('grievanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('description', document.getElementById('description').value);

            const res = await fetch('/submit', { method: 'POST', body: formData });
            const result = await res.json();

            if (result.status === 'success') {
                alert('Grievance Submitted Successfully!');
                document.getElementById('grievanceForm').reset();
                loadComplaints();
            } else {
                alert('Error: ' + result.message);
            }
        });

        loadComplaints();
    </script>
</body>
</html>
